<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocafox — Comunicación Visual</title>
    <style>
        /* Estilos generales y reseteo básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Cabecera / Navegación */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 60px;
            background-color: #0b0b0b;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 1px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo span {
            color: #f97316;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        nav ul li a {
            text-decoration: none;
            color: #d4d4d8;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #f97316;
        }

        .btn-whatsapp {
            background-color: #f97316;
            color: #fff;
            padding: 10px 22px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: background 0.3s;
        }

        .btn-whatsapp:hover {
            background-color: #ea580c;
        }

        /* Sección Hero */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: calc(85vh - 90px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 60px;
            background: #0b0b0b;
        }

        .hero-container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            align-items: center;
        }

        /* Columna de la Imagen (Bombilla) */
        .hero-image-container {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .hero-image-container img {
            width: 100%;
            max-width: 450px;
            height: auto;
            object-fit: contain;
        }

        /* Columna de Contenidos y Textos */
        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sub-title-top {
            font-size: 0.8rem;
            font-weight: 600;
            color: #a1a1aa;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
        }

        .hero-content h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
            margin-bottom: 0;
            color: #ffffff;
        }

        .hero-content h1 .highlight {
            color: #f97316;
            position: relative;
            display: inline-block;
        }

        /* Subtítulo descriptivo original */
        .hero-desc {
            font-size: 1rem;
            color: #a1a1aa;
            margin-top: 24px;
            margin-bottom: 12px;
            font-weight: 400;
        }

        /* Caja Animada (Icono + Texto Escritura en bucle) */
        .animated-service-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
            margin-bottom: 24px;
            background: rgba(18, 18, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 16px;
            border-radius: 6px;
            max-width: 360px;
        }

        .service-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .service-icon svg {
            width: 22px;
            height: 22px;
            stroke: #f97316;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .service-text-wrapper {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #ffffff;
            display: flex;
            align-items: center;
            min-height: 1.4rem;
        }

        /* Cursor intermitente estilo terminal */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background-color: #f97316;
            margin-left: 3px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Botón inferior "QUÉ HACEMOS" y correo */
        .actions-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            max-width: 520px;
        }

        .btn-outline {
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            border-color: #f97316;
            color: #f97316;
        }

        .contact-email {
            font-size: 0.85rem;
            color: #71717a;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Diseño Responsivo */
        @media (max-width: 900px) {
            .hero-container {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-image-container {
                justify-content: center;
                order: 2;
            }
            .hero-content {
                order: 1;
                align-items: center;
            }
            .hero-content h1 {
                font-size: 3rem;
            }
            .actions-row {
                flex-direction: column;
                gap: 20px;
            }
            header {
                padding: 20px;
            }
            nav ul {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Cabecera -->
    <header>
        <div class="logo">
            ROCA<span>FOX</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">INICIO</a></li>
                <li><a href="#">SERVICIO</a></li>
                <li><a href="#">PORTAFOLIO</a></li>
                <li><a href="#">CONTACTO</a></li>
            </ul>
        </nav>
        <a href="#" class="btn-whatsapp">WHATSAPP</a>
    </header>

    <!-- Sección Hero Principal -->
    <section class="hero-section">
        <div class="hero-container">
            
            <!-- Columna Izquierda: Imagen de la bombilla -->
            <div class="hero-image-container">
                <!-- Reemplaza el src con la ruta real de tu imagen de la bombilla -->
                <img src="ruta-a-tu-imagen-bombilla.png" alt="Bombilla Rocafox">
            </div>

            <!-- Columna Derecha: Textos y Animación -->
            <div class="hero-content">
                <span class="sub-title-top">CÓMO PODEMOS AYUDARTE</span>
                
                <h1>
                    Nos encantaría<br>
                    <span class="highlight">asesorarte</span>
                </h1>

                <p class="hero-desc">Eleva las expectativas de tu marca al máximo.</p>

                <!-- CAJA DINÁMICA CON EFECTO DE ESCRITURA Y CAMBIO DE ICONO -->
                <div class="animated-service-box">
                    <div class="service-icon" id="iconBox">
                        <!-- El icono SVG se inyectará dinámicamente vía JS -->
                    </div>
                    <div class="service-text-wrapper">
                        <span id="typedText"></span><span class="cursor"></span>
                    </div>
                </div>

                <!-- Botón inferior y correo -->
                <div class="actions-row">
                    <a href="#" class="btn-outline">QUÉ HACEMOS</a>
                    <a href="mailto:comercial@rocafox.com.uy" class="contact-email">
                        ✉ comercial@rocafox.com.uy
                    </a>
                </div>
            </div>

        </div>
    </section>

    <!-- Script JavaScript para el efecto de escritura y borrado en bucle -->
    <script>
        // Lista de secciones / servicios con sus respectivos iconos SVG limpios
        const services = [
            {
                text: "EN IMPRESIÓN DIGITAL",
                svg: '<svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 14h12v8H6z"></path></svg>'
            },
            {
                text: "CORPÓREAS",
                svg: '<svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>'
            },
            {
                text: "CARTELERÍA VEHICULAR",
                svg: '<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>'
            },
            {
                text: "SEÑALIZACIÓN",
                svg: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>'
            }
        ];

        let currentIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typingSpeed = 100;

        const typedTextSpan = document.getElementById("typedText");
        const iconBox = document.getElementById("iconBox");

        function typeWriter() {
            const currentService = services[currentIndex];
            const fullText = currentService.text;

            // Actualizar el icono SVG correspondiente
            iconBox.innerHTML = currentService.svg;

            if (!isDeleting) {
                // Escribiendo letra por letra
                typedTextSpan.textContent = fullText.substring(0, charIndex + 1);
                charIndex++;

                if (charIndex === fullText.length) {
                    // Pausa de 2 segundos al completar la frase antes de borrar
                    isDeleting = true;
                    typingSpeed = 60; // Borra más rápido
                    setTimeout(typeWriter, 2000);
                    return;
                }
            } else {
                // Borrando letra por letra
                typedTextSpan.textContent = fullText.substring(0, charIndex - 1);
                charIndex--;

                if (charIndex === 0) {
                    isDeleting = false;
                    // Pasar al siguiente servicio en bucle circular
                    currentIndex = (currentIndex + 1) % services.length;
                    typingSpeed = 100; // Restaurar velocidad de escritura
                }
            }

            setTimeout(typeWriter, typingSpeed);
        }

        // Iniciar la animación al cargar la página
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(typeWriter, 400);
        });
    </script>
</body>
</html>
